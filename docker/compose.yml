# 서버 한 대에서 게임·MySQL·Redis 를 함께 띄운다. 먼저 ./gradlew bootJar 로 JAR 을 만든다.
#   docker compose -f docker/compose.yml --env-file docker/.env up -d
name: webcraft
services:
  mysql:
    image: mysql:8.4
    restart: always
    command: [--log-bin-trust-function-creators=1]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-12345678}
      MYSQL_DATABASE: webcraft
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD-SHELL, 'mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent']
      interval: 5s
      timeout: 5s
      retries: 60

  redis:
    image: redis:7-alpine
    restart: always

  game:
    image: eclipse-temurin:21-jre
    restart: always
    command: [java, -jar, /app/game.jar]
    ports: ['${PORT:-8080}:8080']
    volumes:
      - ${GAME_JAR:-../build/libs/game-expert-0.0.1-SNAPSHOT.jar}:/app/game.jar:ro
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/webcraft
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-12345678}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: '6379'
      # 운영 스위치(README 참고). 비워 두면 엔진 기본값.
      WEBCRAFT_PLAYERS_MAX: ${PLAYERS_MAX:-3}
      WEBCRAFT_WORLDS_FIXED: ${WORLDS_FIXED:-false}
      WEBCRAFT_WARMWORLDSONSTARTUP: ${WARM_WORLDS:-true}
      WEBCRAFT_KEEPWORLDSLOADED: ${KEEP_LOADED:-true}
    depends_on:
      mysql: {condition: service_healthy}

volumes:
  mysql-data:
